plugins {
	id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = 'fokus.xyz'
}

loom {
	// Minecraft 26.x ships unobfuscated, so no mappings dependency is declared.
	mods {
		"fokus" {
			sourceSet sourceSets.main
		}
	}
	runs {
		client {
			programArgs "--width", "1280", "--height", "720"
			vmArg "-Dmixin.debug.countInjections=true"
		}
	}
}

dependencies {
	// Compiled against one version (26.3 by default); every hook that differs between
	// 26.1, 26.2 and 26.3 is matched by name at runtime, so the same jar runs on all three.
	// Check another version with: gradlew build -Pminecraft_version=26.1
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
